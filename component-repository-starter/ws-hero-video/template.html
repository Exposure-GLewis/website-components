<div class="cl-hero-video">
  <div class="cl-hero-video__content">
    <h1>Hero Video Heading</h1>
  </div>
  <div class="cl-hero-video__media" aria-label="Featured video">
    <video class="cl-hero-video__video" muted playsinline loop preload="metadata" data-mobile-src="/path/to/mobile.mp4" data-tablet-src="/path/to/tablet.mp4" data-desktop-src="/path/to/desktop.mp4"></video>
    <div class="cl-hero-video__controls">
      <button class="cl-hero-video__toggle" type="button"><span class="cl-hero-video__sr-only">Pause video</span></button>
    </div>
  </div>
</div>
