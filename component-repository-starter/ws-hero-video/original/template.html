<div id="hero">
  <div class="wrap">
    <h1>Hero Video Heading</h1>
  </div>
  <div class="hero-video" aria-label="Featured video">
    <video id="responsiveVideo" muted playsinline loop preload="metadata"></video>
    <div class="video-controls">
      <button id="videoToggle" class="video-toggle" type="button"><span class="sr-only">Pause video</span></button>
    </div>
  </div>
</div>
